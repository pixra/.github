<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <!-- Subtle Background Glow for Depth -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    
    <!-- Premium Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a8b2bd" />
    </linearGradient>
  </defs>

  <style>
    /* Modern Bold Sans-Serif for Tech Vibe */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      fill: url(#textGrad);
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: -1px;
    }
    
    /* Sleek Monospace/Sans Subtitle */
    .subtitle {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      fill: #8b949e;
      text-anchor: middle;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    /* Smoother, Cinematic 15-second Animation Cycle */
    .anim-text {
      opacity: 0;
      animation: dropBlur 15s infinite cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    
    /* Staggered Delays for 3 lines (5 seconds each) */
    .anim-text:nth-child(1) { animation-delay: 0s; }
    .anim-text:nth-child(2) { animation-delay: 5s; }
    .anim-text:nth-child(3) { animation-delay: 10s; }

    /* Refined Top-to-Bottom Blur Keyframes */
    @keyframes dropBlur {
      0% { opacity: 0; transform: translateY(-20px) scale(0.95); filter: blur(10px); }
      10%, 25% { opacity: 1; transform: translateY(0px) scale(1); filter: blur(0px); }
      33%, 100% { opacity: 0; transform: translateY(20px) scale(1.02); filter: blur(10px); }
    }
  </style>

  <!-- Deep GitHub Dark Background -->
  <rect width="100%" height="100%" fill="#0d1117" />
  
  <!-- Subtle Center Glow -->
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <!-- Animated Main Titles -->
  <g transform="translate(400, 110)">
    <text class="title anim-text">Welcome to Pixra Global.</text>
    <text class="title anim-text">Architecting Digital Ecosystems.</text>
    <text class="title anim-text">Engineering the Future.</text>
  </g>
  
  <!-- Static Premium Subtitle -->
  <text x="400" y="210" class="subtitle">Innovation • Intelligence • Resilience</text>
</svg>
